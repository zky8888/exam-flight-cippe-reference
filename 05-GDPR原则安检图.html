:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  /* Preserve MCP aliases for older inline renderers without creating :root cycles. */
  --color-background-primary: var(
    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))
  );
  --color-text-primary: var(
    --foreground,
    light-dark(rgb(26 28 31), rgb(255 255 255))
  );
  --color-border-secondary: var(
    --border,
    light-dark(rgb(26 28 31 / 8%), rgb(255 255 255 / 8.2%))
  );

  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--font-weight-medium, 500);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  border-collapse: collapse;
  color: var(--foreground);
  font: inherit;
  text-align: start;
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead th {
  padding-block: 8px;
  border-bottom-color: color-mix(in srgb, var(--foreground) 16%, transparent);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}

.table.table-sm :is(th, td) {
  padding-block: 6px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.progress {
  display: flex;
  height: 6px;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)

}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;gdpr-journey-lab&quot;&gt;

        &lt;option value=&quot;security&quot;&gt;客户数据库可公开访问&lt;/option&gt;

      &lt;span class=&quot;viz-badge&quot; id=&quot;gp-case-number&quot;&gt;CASE 01 / 09&lt;/span&gt;

    &lt;/div&gt;
    &lt;h3 id=&quot;gp-case-title&quot;&gt;&lt;/h3&gt;
    &lt;div class=&quot;gp-evidence&quot; id=&quot;gp-evidence&quot; aria-label=&quot;场景中的关键事实&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;gp-route-wrap&quot; aria-label=&quot;数据处理生命周期&quot;&gt;
    &lt;div class=&quot;gp-route&quot; id=&quot;gp-route&quot;&gt;
      &lt;div class=&quot;gp-stage&quot; data-stage=&quot;before&quot;&gt;
        &lt;div class=&quot;gp-node&quot; aria-hidden=&quot;true&quot;&gt;&lt;i data-lucide=&quot;key-round&quot;&gt;&lt;/i&gt;&lt;/div&gt;
        &lt;div class=&quot;text-small gp-step&quot;&gt;CHECKPOINT 01&lt;/div&gt;
        &lt;h3&gt;拿之前&lt;/h3&gt;
        &lt;div class=&quot;text-muted gp-stage-default&quot;&gt;依据 · 公平 · 目的 · 告知&lt;/div&gt;
        &lt;div class=&quot;gp-stage-focus&quot; aria-live=&quot;polite&quot;&gt;
          &lt;div class=&quot;gp-stage-question&quot;&gt;&lt;/div&gt;

      &lt;div class=&quot;gp-stage&quot; data-stage=&quot;during&quot;&gt;

        &lt;div class=&quot;text-small gp-step&quot;&gt;CHECKPOINT 02&lt;/div&gt;
        &lt;h3&gt;使用时&lt;/h3&gt;
        &lt;div class=&quot;text-muted gp-stage-default&quot;&gt;必要 · 正确 · 安全&lt;/div&gt;
        &lt;div class=&quot;gp-stage-focus&quot; aria-live=&quot;polite&quot;&gt;
          &lt;div class=&quot;gp-stage-question&quot;&gt;&lt;/div&gt;
          &lt;code class=&quot;gp-stage-term&quot;&gt;&lt;/code&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;gp-stage&quot; data-stage=&quot;after&quot;&gt;

        &lt;div class=&quot;text-small gp-step&quot;&gt;CHECKPOINT 03&lt;/div&gt;
        &lt;h3&gt;用完后&lt;/h3&gt;

        &lt;div class=&quot;gp-stage-focus&quot; aria-live=&quot;polite&quot;&gt;
          &lt;div class=&quot;gp-stage-question&quot;&gt;&lt;/div&gt;
          &lt;code class=&quot;gp-stage-term&quot;&gt;&lt;/code&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;gp-accountability&quot; id=&quot;gp-accountability&quot;&gt;

      &lt;div&gt;
        &lt;div class=&quot;text-small&quot;&gt;贯穿整条路的证据轨道&lt;/div&gt;

      &lt;/div&gt;

  &lt;/section&gt;

  &lt;section class=&quot;card gp-verdict&quot; id=&quot;gp-verdict&quot; aria-live=&quot;polite&quot;&gt;

      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;gp-practice&quot;&gt;&lt;i data-lucide=&quot;sparkles&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;出一道英文变式题&lt;/span&gt;&lt;/button&gt;

        &lt;div class=&quot;gp-map-item&quot; data-principle=&quot;lawfulness&quot;&gt;&lt;span&gt;有依据吗？&lt;/span&gt;&lt;code&gt;lawfulness&lt;/code&gt;&lt;/div&gt;

  &lt;script&gt;

          question: &#x27;个人是否被清楚告知了真实用途？&#x27;, principle: &#x27;Transparency&#x27;,
          why: &#x27;公司知道真实 why，但个人没有得到清楚、准确的解释。&#x27;,
          neighbor: &#x27;不是 purpose limitation：公司内部的目的已经很具体。&#x27;
        },
        storage: {
          stage: &#x27;after&#x27;, title: &#x27;平台完成年龄验证后，仍永久保存护照&#x27;,
          evidence: [[&#x27;年龄验证：已完成&#x27;, &#x27;good&#x27;], [&#x27;护照：永久保存&#x27;, &#x27;alarm&#x27;]],
          question: &#x27;原目的完成以后，还需要继续保存吗？&#x27;, principle: &#x27;Storage limitation&#x27;,
          why: &#x27;验证已经完成，却没有新理由而无限期保留高价值身份文件。&#x27;,
          neighbor: &#x27;看到 purpose completed + kept indefinitely，优先检查保存期限。&#x27;
        },
        accuracy: {

          question: &#x27;用于决定的数据是否准确并得到及时更正？&#x27;, principle: &#x27;Accuracy&#x27;,
          why: &#x27;数据内容本身错误，而且控制者知道后仍继续使用。&#x27;,
          neighbor: &#x27;不是 minimisation：这里不是数据太多，而是数据是错的。&#x27;
        },
        security: {
          stage: &#x27;during&#x27;, title: &#x27;客户数据库可以通过公开链接直接访问&#x27;,
          evidence: [[&#x27;客户数据库：个人数据&#x27;, &#x27;normal&#x27;], [&#x27;访问方式：公开链接&#x27;, &#x27;alarm&#x27;]],
          question: &#x27;个人数据是否受到适当的安全保护？&#x27;, principle: &#x27;Integrity and confidentiality&#x27;,
          why: &#x27;未经授权的人可以访问数据，保护措施明显不足。&#x27;,
          neighbor: &#x27;问的是 safe，不是 why、how much 或 how long。&#x27;
        },
        lawfulness: {
          stage: &#x27;before&#x27;, title: &#x27;公司找不到任何法律依据，却已经开始处理&#x27;,
          evidence: [[&#x27;处理活动：已经开始&#x27;, &#x27;normal&#x27;], [&#x27;法律依据：没有&#x27;, &#x27;alarm&#x27;]],
          question: &#x27;我们有权开始这项处理吗？&#x27;, principle: &#x27;Lawfulness&#x27;,
          why: &#x27;处理缺少合法性基础或其他适用的法律条件。&#x27;,
          neighbor: &#x27;先问 can we；有依据之后，才继续检查其他原则。&#x27;
        },
        fairness: {
          stage: &#x27;before&#x27;, title: &#x27;平台秘密利用儿童情绪弱点，对其动态抬价&#x27;,
          evidence: [[&#x27;对象：儿童&#x27;, &#x27;normal&#x27;], [&#x27;利用情绪弱点&#x27;, &#x27;alarm&#x27;], [&#x27;结果：动态抬价&#x27;, &#x27;alarm&#x27;]],
          question: &#x27;这种处理方式会不会欺骗、利用或不公正伤害个人？&#x27;, principle: &#x27;Fairness&#x27;,
          why: &#x27;它利用脆弱性，并产生个人难以合理预期的不利结果。&#x27;,
          neighbor: &#x27;fairness 不等于“感觉不舒服”；要找利用、欺骗或不公正影响。&#x27;
        },
        accountability: {
          stage: &#x27;all&#x27;, title: &#x27;公司声称全部合规，却没有任何记录或证据&#x27;,
          evidence: [[&#x27;口头声明：全部合规&#x27;, &#x27;normal&#x27;], [&#x27;记录与证据：没有&#x27;, &#x27;alarm&#x27;]],
          question: &#x27;控制者能否证明自己遵守了所有原则？&#x27;, principle: &#x27;Accountability&#x27;,
          why: &#x27;合规不仅要做到，还必须能够用记录、评估和措施证明。&#x27;,
          neighbor: &#x27;它不是最后一步，而是一条贯穿整个处理过程的证据轨道。&#x27;
        }
      };

      const keys = Object.keys(scenarios);
      let concealed = false;

      function evidenceNode(label, tone) {
        const node = document.createElement(&#x27;div&#x27;);
        node.className = &#x27;gp-evidence-item&#x27;;
        node.dataset.tone = tone;
        const dot = document.createElement(&#x27;span&#x27;);
        dot.className = &#x27;gp-evidence-dot&#x27;;
        dot.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
        const text = document.createElement(&#x27;span&#x27;);
        text.textContent = label;
        node.append(dot, text);
        return node;
      }

      function setConcealed(value) {
        concealed = value;
        verdict.dataset.concealed = String(concealed);
        conceal.querySelector(&#x27;span&#x27;).textContent = concealed ? &#x27;显示答案&#x27; : &#x27;遮住答案&#x27;;
      }

      function render() {
        const key = select.value;
        const item = scenarios[key];
        const index = keys.indexOf(key);
        caseNumber.textContent = `CASE ${String(index + 1).padStart(2, &#x27;0&#x27;)} / ${String(keys.length).padStart(2, &#x27;0&#x27;)}`;
        caseTitle.textContent = item.title;
        evidence.replaceChildren(...item.evidence.map(([label, tone]) =&gt; evidenceNode(label, tone)));

        route.querySelectorAll(&#x27;.gp-stage&#x27;).forEach((stage) =&gt; {
          const active = stage.dataset.stage === item.stage;
          stage.dataset.active = String(active);
          stage.querySelector(&#x27;.gp-stage-default&#x27;).hidden = active;
          stage.querySelector(&#x27;.gp-stage-focus&#x27;).hidden = !active;
          if (active) {
            stage.querySelector(&#x27;.gp-stage-question&#x27;).textContent = item.question;
            stage.querySelector(&#x27;.gp-stage-term&#x27;).textContent = item.principle;
          }
        });

        accountability.dataset.active = String(item.stage === &#x27;all&#x27;);
        principle.textContent = item.principle;
        question.textContent = item.question;
        why.textContent = item.why;
        neighbor.textContent = item.neighbor;
        root.querySelectorAll(&#x27;.gp-map-item&#x27;).forEach((node) =&gt; {
          node.dataset.active = String(node.dataset.principle === key);
        });
        root.querySelectorAll(&#x27;.gp-memory&#x27;).forEach((node) =&gt; {
          node.setAttribute(&#x27;aria-pressed&#x27;, String(node.dataset.jump === key));
        });
        status.textContent = &#x27;&#x27;;
        setConcealed(false);
      }

      function move(delta) {
        const index = keys.indexOf(select.value);
        select.value = keys[(index + delta + keys.length) % keys.length];
        render();
      }

      select.addEventListener(&#x27;change&#x27;, render);
      prev.addEventListener(&#x27;click&#x27;, () =&gt; move(-1));
      next.addEventListener(&#x27;click&#x27;, () =&gt; move(1));
      conceal.addEventListener(&#x27;click&#x27;, () =&gt; setConcealed(!concealed));
      root.querySelectorAll(&#x27;.gp-memory&#x27;).forEach((node) =&gt; {
        node.addEventListener(&#x27;click&#x27;, () =&gt; {
          select.value = node.dataset.jump;
          render();
        });
      });

      practice.addEventListener(&#x27;click&#x27;, async () =&gt; {
        const item = scenarios[select.value];
        const prompt = `请基于 ${item.principle} 给我一道新的英文 CIPP/E 情景选择题。不要先公布答案。我用英文回答后，请先英文反馈、再用中文分析，并记录信心。`;
        if (window.openai &amp;&amp; window.openai.sendFollowUpMessage) {
          await window.openai.sendFollowUpMessage({ title: &#x27;开始原则辨析题&#x27;, prompt });
        } else {
          status.textContent = `回到我们的 CIPP/E 学习任务并发送：${prompt}`;
        }
      });

      render();
    })();
